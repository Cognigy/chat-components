sonar.projectKey=com.nice.cognigy-boron-chat-components
sonar.projectName=cognigy-boron-chat-components

sonar.sources=.
sonar.tests=.
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/vendor/**,\
  **/coverage/**,\
  **/*.gen.go,\
  **/*.gen.ts

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*_test.go,\
  **/__tests__/**,\
  **/*.spec.tsx,\
  **/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
